<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Empire: Four Kingdoms — Royal Multiplayer v8</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="app" class="app">
    <header id="hud" class="hud"></header>

    <div class="sub-toolbar">
      <div class="realm-bar">
        <select id="realm-select" aria-label="Королевство">
          <option value="great_empire">Великая империя</option>
          <option value="burning_sands">Пылающие пески</option>
          <option value="everwinter">Вечный холод</option>
          <option value="fire_peaks">Огненные вершины</option>
        </select>
        <button id="btn-tax" class="mini-btn gold" type="button">Налоги</button>
        <button id="btn-ruby-boost" class="mini-btn ruby" type="button">Ускорить (15💎)</button>
      </div>
      <div id="timer-strip" class="timer-strip"></div>
    </div>

    <div id="toast-banner" class="toast-banner hidden"></div>

    <main id="view-container" class="view-container"></main>

    <section id="event-log-panel" class="log-panel">
      <div class="log-header">
        <span>📜 Хроники империи</span>
        <button id="btn-toggle-log" class="mini-btn" type="button">Свернуть</button>
      </div>
      <ul id="event-log" class="event-log"></ul>
    </section>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-tab="castle" type="button">🏰 Замок</button>
      <button class="nav-btn" data-tab="map" type="button">🗺️ Карта</button>
      <button class="nav-btn" data-tab="battle" type="button">⚔️ Штурм</button>
      <button class="nav-btn" data-tab="command" type="button">👑 Герои</button>
      <button class="nav-btn" data-tab="system" type="button">🛡️ Империя</button>
    </nav>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
